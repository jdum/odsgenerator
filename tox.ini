[tox]
envlist =
    lint,
    py310-odfdo{3273},
    py311-odfdo{3273},
    py312-odfdo{3273},
    py313-odfdo{3273},
    py314-odfdo{3273},
    py315-odfdo{3273}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: lint, py314
    3.15: py315

[testenv:py{310,311,312,313,314,315}-odfdo{3273}]
passenv = PYTHON_VERSION
deps =
    pytest>=9.1.1
    odfdo3273: odfdo==3.27.3
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest

[testenv:lint]
skip_install = true
allowlist_externals = ruff
commands =
    ruff check src tests
