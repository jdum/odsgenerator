[tox]
envlist =
    lint,
    py310-odfdo{3190,3226,3247,3272},
    py311-odfdo{3190,3202,3226,3247,3272},
    py312-odfdo{3190,3202,3226,3247,3272},
    py313-odfdo{3190,3202,3226,3247,3272},
    py314-odfdo{3190,3202,3226,3231,3247,3272},
    py315-odfdo{3190,3202,3226,3231,3247,3272}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: lint, py314
    3.15: py315

[testenv:py{310,311,312,313,314,315}-odfdo{3190,3202,3226,3231,3247,3272}]
passenv = PYTHON_VERSION
deps =
    pytest>=9.1.1
    odfdo3190: odfdo==3.19.0
    odfdo3202: odfdo==3.20.2
    odfdo3226: odfdo==3.22.6
    odfdo3231: odfdo==3.23.1
    odfdo3247: odfdo==3.24.7
    odfdo3272: odfdo==3.27.2
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest

[testenv:lint]
skip_install = true
allowlist_externals = ruff
commands =
    ruff check src tests
