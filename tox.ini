[tox]
skipsdist = true
envlist =
    lint,
    py310-odfdo{377,3713,380},
    py311-odfdo{377,3713,380,3145},
    py312-odfdo{377,380,31311,3145,3226},
    py313-odfdo{377,31311,3145,3226}
    py314-odfdo{3168,3170,3226,3230}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313,
    3.14: py314, lint

[testenv:py{310,311,312,313,314}-odfdo{377,3713,380,31311,3145,3168,3170,3226,3230}]
passenv = PYTHON_VERSION
deps =
    odfdo377: odfdo==3.7.7
    odfdo3713: odfdo==3.7.13
    odfdo380: odfdo==3.8.0
    odfdo31311: odfdo==3.13.11
    odfdo3145: odfdo==3.14.5
    odfdo3168: odfdo==3.16.8
    odfdo3170: odfdo==3.17.0
    odfdo3226: odfdo==3.22.6
    odfdo3230: odfdo==3.23.0
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest

[testenv:lint]
allowlist_externals = ruff, mypy
commands =
    ruff check src
